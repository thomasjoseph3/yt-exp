# Thoma Studio settings. Secrets go in .env, never here.

channel:
  name: "Thoma Explains"
  timezone: "Asia/Kolkata"

# Script writers, tried in order. Only Qoder and Claude write content: if both are unavailable
# (limits reached, offline), the studio waits and retries on the next tick instead of using a
# weaker model. A provider that fails is skipped for cooldown_minutes, then tried again.
#   cli        : a coding-agent CLI in print mode, prompt on stdin (Qoder CLI)
#   claude_cli : your Claude subscription through `claude -p`
llm:
  providers:
    - name: qoder                      # first choice: uses your Qoder credits
      type: cli
      command: ["qodercli", "-p"]       # npm i -g @qoder-ai/qodercli ; then `qodercli` and /login once
    - name: claude                     # backup: your Claude subscription
      type: claude_cli
      model: sonnet
  # After a provider fails, skip it for this many minutes before trying it again.
  cooldown_minutes: 60

# Where ideas come from. These channels are mined for topics and facts only: Thoma
# never reuses their words, visuals or audio (writer.py blocks copied phrasing).
sources:
  youtube_channels:
    - name: IBM Technology
      channel_id: UCKWaEZ-_VweaEx1j62do_vQ
    - name: ByteMonk
      channel_id: UCzCsyvyrq38R6TnztEzOmgg
    - name: Fireship
      channel_id: UCsBjURrPoezykLs9EqgamOA
  refresh_hours: 6

# AI tool videos: "tool spotlight" Shorts and "how to use" tutorials, from Product Hunt's AI feed
# (new launches) and assets/ai_tools.txt (well-known tools people search for).
ai_tools:
  enabled: true
  feed: https://www.producthunt.com/feed?category=artificial-intelligence
  share: {short: 0.35, long: 0.25}   # fraction of videos that are about an AI tool
  # Your affiliate links. When a video mentions the tool, the link goes in the description with a
  # disclosure line. Example:  "Notion AI": "https://affiliate.notion.so/your-code"
  affiliates: {}

# When videos go out (local time, see channel.timezone). The studio makes videos for the slots
# in the next plan_ahead_hours and uploads them with that release time; YouTube publishes them
# at the slot by itself, so this machine only has to be on at some point before (e.g. overnight).
# Default times target both audiences: 06:30 IST is 8 pm in New York (US prime time, higher ad
# rates); 19:30 IST is Indian prime time. Tune them after 2 weeks with YouTube Studio ->
# Analytics -> Audience -> "When your viewers are on YouTube".
schedule:
  publish_times:
    short: ["07:30", "19:30"]
    long: ["06:30"]
  long_days: [mon, tue, wed, thu, fri, sat, sun]
  plan_ahead_hours: 36          # e.g. switched on at 21:00 -> makes everything up to 09:00 the day after
  tick_minutes: 15

# Shorts rotate between these formats (relative weights) so the channel never looks templated.
# "news" is only used for topics fresh from the source channels.
short_formats: {explainer: 60, myth: 15, guess: 10, news: 15}

publish:
  # approve: each video waits for your /approve on Telegram (or `thoma approve <id>`), then
  #          gets the next free slot.
  # auto   : finished videos take the next free slot automatically; you get them on Telegram
  #          and can /reject (or cancel in the YouTube Studio app) before they go live.
  mode: approve
  # Google's API audit lifts the "uploads stay private" lock. Until then, set the schedule in
  # the YouTube Studio app yourself (the Telegram message tells you the time). Then set true.
  youtube_audited: false
  # youtube | instagram | facebook | telegram
  # "telegram" sends you the full-quality file plus a ready-to-copy caption, for posting
  # to Instagram/Facebook by hand. Swap it for instagram/facebook once Meta is set up.
  short_platforms: [youtube, telegram]
  long_platforms: [youtube, telegram]
  youtube_category: "27"               # Education
  graph_api_version: v26.0             # Meta Graph API; bump when Meta deprecates it

voice:
  # Tried in order, per scene; a failing engine is skipped for the rest of that video.
  #   gemini = Gemini TTS via your AI Studio key (GEMINI_API_KEY). Free tier, most natural, takes a style.
  #   google = Google Cloud Chirp 3 HD (GOOGLE_TTS_API_KEY). 1M chars/month free; needs a billing card.
  #   kokoro = local, free, offline, more robotic. Always the last resort.
  engines: [gemini, google, kokoro]
  gemini_models: [gemini-3.8-flash-tts, gemini-3.1-flash-tts-preview, gemini-2.5-flash-preview-tts]  # tried in order when one is busy
  gemini_voice: Puck                   # run `thoma voices` to hear the options, then pick one
  gemini_style: >-
    You are Thoma, the host of a popular YouTube tech explainer channel, talking to one curious
    friend. Sound like a real, charismatic YouTuber, never an audiobook narrator or a robot reading a
    script: conversational, upbeat and confident, with a smile in your voice. Keep a brisk, flowing
    pace with no dramatic or long pauses; let sentences run into each other the way people really
    talk. Lean on the key words, let your pitch move, and say the jokes lightly and quickly, like you
    genuinely think this stuff is cool.
  target_wpm: 165                      # natural explainer pace; slower takes are sped up to this
  google_voice: en-US-Chirp3-HD-Puck
  google_monthly_char_cap: 900000      # Chirp free tier is 1M/month; stop before that so it never bills
  kokoro_voice: am_michael
  speed: 1.0                           # local voice only
  audition_voices: [Puck, Fenrir, Charon, Orus, Achird, Sadachbia]   # `thoma voices` uses 1 free request each
  audition_kokoro: [am_michael, am_puck, bm_george]
  # Spelling fixes so the voice says terms right: written form -> spoken form.
  say_as:
    "LLMs": "L L Ms"
    "LLM": "L L M"
    "RAG": "rag"
    "GPU": "G P U"
    "GPUs": "G P Us"
    "API": "A P I"
    "APIs": "A P Is"
    "SQL": "sequel"
    "JSON": "jason"
    "AI": "A I"

# Disk housekeeping (runs every tick). Long videos stay as your copy; Shorts live on Telegram.
storage:
  keep_long_days: 14        # long video files are deleted after this many days
  keep_failed_days: 3       # failed / rejected videos
  delete_published_shorts: true

video:
  fps: 25

# Background music, quiet under the voice and ducked further while Thoma speaks.
# Kevin MacLeod tracks (incompetech.com, CC BY 4.0): free, credited automatically in descriptions.
music:
  volume: 0.18
  short: ["Sneaky Snitch.mp3", "Fluffing a Duck.mp3", "Carefree.mp3"]
  long: ["Wallpaper.mp3", "Local Forecast - Elevator.mp3", "Inspired.mp3"]
  credit: 'Music: "{track}" by Kevin MacLeod (incompetech.com), licensed under CC BY 4.0'

