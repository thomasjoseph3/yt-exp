# Thoma Studio settings. Secrets go in .env, never here.

channel:
  name: "Thoma Explains"
  timezone: "Asia/Kolkata"
  youtube_handle: ""        # e.g. "@ThomaExplains" once the channel exists: adds a subscribe link to descriptions

# Script writers, tried in order. Qoder writes (Gemini Flash when Qoder is out), Claude Sonnet checks.
# Owner (2026-10-29): never Opus for scripts, it writes too technically; save Claude for checking.
# If every provider for a job is unavailable, the studio waits and retries on the next tick.
# A provider that fails is skipped for cooldown_minutes, then tried again.
#   cli        : a coding-agent CLI in print mode, prompt on stdin (Qoder CLI)
#   gemini     : Gemini through your AI Studio key (GEMINI_API_KEY), free tier; Pro has no free quota
#   claude_cli : your Claude subscription through `claude -p`
llm:
  providers:
    - name: qoder                      # first choice. With paid credits add e.g. "-m", "<model>" (`qodercli --list-models`);
      type: cli                        # with credits used up it answers with its free model
      command: ["qodercli", "-p", "--tools", ""]   # tools off: it only writes (with tools it wandered for 15+ min)
                                                  # install: npm i -g @qoder-ai/qodercli ; then `qodercli` and /login once
    - name: gemini                     # backup writer, free: each model x key has its own daily quota
      type: gemini
      models: [gemini-3-flash-preview, gemini-2.5-flash]
    - name: claude                     # the checker: your Claude subscription (Sonnet, never Opus)
      type: claude_cli
      model: sonnet
  # Who does which job (tried in order). Qoder writes, Claude checks every script; Claude's notes go back
  # to Qoder for the rewrite, and each check is logged (`thoma lessons`) so recurring mistakes get fixed
  # in the prompts. `thoma make ... --llm <name>` puts one provider on every job for that video.
  roles:
    research: [qoder, gemini]
    write: [gemini, qoder]        # owner 2026-10-29: speed. Gemini drafts in ~40 s; Qoder free takes 2-7 min a draft
    review: [claude, gemini]
    triage: [qoder, gemini]
  # After a provider fails, skip it for this many minutes before trying it again.
  cooldown_minutes: 60

# Where ideas come from. These channels are mined for topics and facts only: Thoma
# never reuses their words, visuals or audio (writer.py blocks copied phrasing).
sources:
  youtube_channels:
    - name: IBM Technology
      channel_id: UCKWaEZ-_VweaEx1j62do_vQ
    - name: ByteMonk
      channel_id: UCzCsyvyrq38R6TnztEzOmgg
    - name: Fireship
      channel_id: UCsBjURrPoezykLs9EqgamOA
  refresh_hours: 6
  # Tech news: the triage keeps the live debates (AI money, jobs, privacy, lawsuits, safety...) and each becomes a
  # "big debate" long video + teaser Short, researched from several outlets with both sides and a sources list.
  # Partisan politics, war, crime and health claims are never picked (YouTube ad rules and accuracy).
  news_feeds:
    - https://www.theverge.com/rss/index.xml
    - https://feeds.arstechnica.com/arstechnica/index
    - https://techcrunch.com/feed/
    - https://www.wired.com/feed/rss
    - https://hnrss.org/frontpage?points=300
  news_days: 10              # a news debate not made within this many days is dropped (old news)
  # Long videos take turns so the channel never runs one format twice in a row (owner, 2026-10-30):
  #   debate = the big tech debates (assets/debates.txt + news), how = how it really works, explain = AI concepts
  long_rotation: [debate, how, explain]

# AI tool videos: "tool spotlight" Shorts and "how to use" tutorials, from Product Hunt's AI feed
# (new launches) and assets/ai_tools.txt (well-known tools people search for).
ai_tools:
  enabled: true
  feed: https://www.producthunt.com/feed?category=artificial-intelligence
  share: {short: 0.35, long: 0.25}   # fraction of videos that are about an AI tool
  # Your affiliate links. When a video mentions the tool, the link goes in the description with a
  # disclosure line. Example:  "Notion AI": "https://affiliate.notion.so/your-code"
  affiliates: {}

# When videos go out (local time, see channel.timezone). The studio makes videos for the slots
# in the next plan_ahead_hours and uploads them with that release time; YouTube publishes them
# at the slot by itself, so this machine only has to be on at some point before (e.g. overnight).
# Default times target both audiences: 06:30 IST is 8 pm in New York (US prime time, higher ad
# rates); 19:30 IST is Indian prime time. Tune them after 2 weeks with YouTube Studio ->
# Analytics -> Audience -> "When your viewers are on YouTube".
schedule:
  publish_times:
    short: ["19:30"]            # add "07:30" for 2 Shorts a day once Qoder's scripts are reliably good
    long: ["06:30"]
  # Quality over quantity: 3 long videos a week (add a 4th day once quality holds), 1 Short a day.
  long_days: [tue, thu, sat]
  # A week ahead: run the daemon one night and it makes the whole week (3 long + 7 Shorts, ~6 hours),
  # each one comes to Telegram, and /approve puts it in the next free slot. /plan shows the calendar.
  plan_ahead_hours: 168
  tick_minutes: 15

# Shorts rotate between these formats (relative weights) so the channel never looks templated.
# "news" is only used for topics fresh from the source channels.
short_formats: {explainer: 60, myth: 15, guess: 10, news: 15}

publish:
  # approve: each video waits for your /approve on Telegram (or `thoma approve <id>`), then
  #          gets the next free slot.
  # auto   : finished videos take the next free slot automatically; you get them on Telegram
  #          and can /reject (or cancel in the YouTube Studio app) before they go live.
  mode: approve
  # Google's API audit lifts the "uploads stay private" lock. Until then, set the schedule in
  # the YouTube Studio app yourself (the Telegram message tells you the time). Then set true.
  youtube_audited: false
  # youtube | instagram | facebook | telegram
  # "telegram" sends you the full-quality file plus a ready-to-copy caption, for posting
  # to Instagram/Facebook by hand. Swap it for instagram/facebook once Meta is set up.
  short_platforms: [youtube, telegram]
  long_platforms: [youtube, telegram]
  youtube_category: "27"               # Education
  graph_api_version: v26.0             # Meta Graph API; bump when Meta deprecates it

# Real photos in the videos (thoma/images.py): searched on Wikimedia Commons (+ Pexels with PEXELS_API_KEY, free at
# pexels.com/api), checked by a Gemini vision model so only photos that really show the thing are used, and
# credited in every description. Only licenses that allow use in a monetized video, with credit.
# "cc by sa" covers most photos of people and products; remove it to be extra strict (fewer photos found).
images:
  licenses: [cc0, public domain, cc by, cc by sa, godl, pexels]
  check_models: [gemini-2.5-flash-lite, gemini-2.5-flash, gemini-3-flash-preview]

voice:
  # Your own voice (owner's offer, 2026-10-30). Kinds listed here are narrated by you: when the script is
  # written, Telegram sends you a reading sheet; reply to it with a voice note. The studio cleans the audio
  # (noise, long pauses, fluffed lines said twice), matches every visual to your words and renders it.
  # No recording within record_wait_hours: the AI voice reads it, so no slot is missed.
  # e.g. record: [long]  (recommended: your voice on the long videos, AI on the Shorts)
  record: []
  record_wait_hours: 20
  # Tried in order, per scene; a failing engine is skipped for the rest of that video.
  #   gemini = Gemini TTS via your AI Studio key (GEMINI_API_KEY). Free tier, most natural, takes a style.
  #   google = Google Cloud Chirp 3 HD (GOOGLE_TTS_API_KEY). 1M chars/month free; needs a billing card.
  #   kokoro = local, free, offline, more robotic.
  engines: [gemini, google]
  # false: when no engine above has quota left, the video waits (Gemini's free tier resets daily) instead
  # of being voiced by Kokoro, which doesn't sound like Thoma. true: fall back to Kokoro.
  local_fallback: false
  gemini_models: [gemini-3.8-flash-tts, gemini-3.1-flash-tts-preview, gemini-2.5-flash-preview-tts]  # tried in order when one is busy
  gemini_voice: Puck                   # run `thoma voices` to hear the options, then pick one
  gemini_style: >-
    You are Thoma, the host of a popular animated tech explainer channel, walking one curious friend
    through a diagram. Sound like a real, confident engineer who loves this stuff: clear, warm and
    conversational, the way the best YouTube tech explainers talk, never an audiobook narrator, a
    news anchor or a robot. Keep a relaxed, unhurried but lively pace with natural flow, like explaining to a friend who is new to this; sentences run into each other
    the way people really talk, with only tiny breaths, never dramatic pauses. Stress the one key word
    in each sentence, let your pitch rise on questions and drop with certainty on answers, and say the
    jokes lightly and quickly, with a smile in your voice.
  target_wpm: 150                      # owner: 165 felt too fast. Takes far off this are gently slowed or sped up
  google_voice: en-US-Chirp3-HD-Puck
  google_monthly_char_cap: 900000      # Chirp free tier is 1M/month; stop before that so it never bills
  kokoro_voice: am_michael
  speed: 1.0                           # local voice only
  audition_voices: [Puck, Fenrir, Charon, Orus, Achird, Sadachbia]   # `thoma voices` uses 1 free request each
  audition_kokoro: [am_michael, am_puck, bm_george]
  # Spelling fixes so the voice says terms right: written form -> spoken form.
  say_as:
    "LLMs": "L L Ms"
    "LLM": "L L M"
    "RAG": "rag"
    "GPU": "G P U"
    "GPUs": "G P Us"
    "API": "A P I"
    "APIs": "A P Is"
    "SQL": "sequel"
    "JSON": "jason"
    "AI": "A I"

# Disk housekeeping (runs every tick). Long videos stay as your copy; Shorts live on Telegram.
storage:
  keep_long_days: 14        # long video files are deleted after this many days
  keep_failed_days: 3       # failed / rejected videos
  delete_published_shorts: true

video:
  fps: 25

# Background music, quiet under the voice and ducked further while Thoma speaks.
# Kevin MacLeod tracks (incompetech.com, CC BY 4.0): free, credited automatically in descriptions.
music:
  volume: 0.18
  short: ["Sneaky Snitch.mp3", "Fluffing a Duck.mp3", "Carefree.mp3"]
  long: ["Wallpaper.mp3", "Local Forecast - Elevator.mp3", "Inspired.mp3"]
  credit: 'Music: "{track}" by Kevin MacLeod (incompetech.com), licensed under CC BY 4.0'

