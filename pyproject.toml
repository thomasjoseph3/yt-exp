[project]
name = "thoma-studio"
version = "0.1.0"
description = "Thoma: an automated tech-explainer channel (YouTube, Instagram, Facebook)"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.2.1",
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
    "httpx>=0.28.1",
    "imageio-ffmpeg>=0.6.0",
    "kokoro-onnx>=0.6.1",
    "numpy>=2.4.6",
    "pillow>=13.0.0",
    "playwright>=1.64.1",
    "pyyaml>=6.0.3",
    "soundfile>=0.14.0",
    "youtube-transcript-api>=1.2.4",
]

[project.scripts]
thoma = "thoma.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["thoma"]
